name: medpredict_ai_flutter
description: "A Flutter mobile application for early pneumonia detection using AI."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.4.9
  
  # Navigation
  go_router: ^13.0.0
  
  # Networking & Data
  shared_preferences: ^2.2.2
  uuid: ^4.0.0
  intl: ^0.18.0
  logger: ^2.0.0
  dio: ^5.4.0
  image: ^4.1.3
  path_provider: ^2.1.1
  
  # UI & Assets
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  fl_chart: ^0.66.0
  lottie: ^3.0.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  
  # Code Generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
